<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión Documental</title>
    <style>
      *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Helvetica Neue,Arial} 
      .container{max-width:1100px;margin:0 auto;padding:20px}
      .card{border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:16px}
      .row{display:flex;gap:12px;flex-wrap:wrap}
      input,button,select{padding:10px;border:1px solid #cbd5e1;border-radius:8px}
      button{cursor:pointer;background:#0ea5e9;color:#fff;border:none} button.secondary{background:#64748b}
      table{width:100%;border-collapse:collapse} th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}
      .tag{display:inline-block;background:#eef2ff;color:#3730a3;padding:2px 8px;border-radius:999px;font-size:12px;margin-right:6px}
    </style>
  </head>

    <div id="root"></div>
